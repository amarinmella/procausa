    <!--
      Marca el documento solo si el navegador puede animar el reveal. Va inline
      y en el head para que se aplique antes del primer pintado (sin parpadeo).
      Si este script no corre, .reveal queda visible y la pagina se ve igual.
    -->
    <script>
      if ('IntersectionObserver' in window) {
        document.documentElement.classList.add('js-reveal');
      }
    </script>
